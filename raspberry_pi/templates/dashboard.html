<!DOCTYPE html>
<html>
<head>
    <title>Door Access System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Door Access System Dashboard</h1>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Add New User</h5>
                    </div>
                    <div class="card-body">
                        <form id="userForm">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" id="userName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fingerprint ID</label>
                                <input type="number" class="form-control" id="fingerprintId">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">RFID Card</label>
                                <input type="text" class="form-control" id="rfidCard">
                            </div>
                            <button type="submit" class="btn btn-primary">Add User</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>System Status</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <strong>Total Users:</strong> <span id="totalUsers">0</span>
                        </div>
                        <div class="mb-2">
                            <strong>System Status:</strong> <span class="badge bg-success">Online</span>
                        </div>
                        <button class="btn btn-warning" onclick="generateTempPassword()">Generate Temp Password</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Recent Access Log</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>User</th>
                                    <th>Method</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="accessLog">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userData = {
                name: document.getElementById('userName').value,
                fingerprint_id: document.getElementById('fingerprintId').value || null,
                rfid_card: document.getElementById('rfidCard').value || null
            };
            
            fetch('/api/users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            })
            .then(response => response.json())
            .then(data => {
                alert('User added successfully!');
                document.getElementById('userForm').reset();
                loadUsers();
            });
        });
        
        function loadUsers() {
            fetch('/api/users')
            .then(response => response.json())
            .then(users => {
                document.getElementById('totalUsers').textContent = users.length;
            });
        }
        
        function generateTempPassword() {
            const userName = prompt('Enter user name for temporary password:');
            if (userName) {
                fetch('/api/temp_password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_name: userName})
                })
                .then(response => response.json())
                .then(data => {
                    alert(`Temporary password: ${data.password}\nExpires in: ${data.expires_in}`);
                });
            }
        }
        
        loadUsers();
    </script>
</body>
</html>
